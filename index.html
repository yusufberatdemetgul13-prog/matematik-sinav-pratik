<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik Sınav Çalışma Sistemi - Design by Yusuf Berat Demetgül</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --error: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: #60a5fa;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 10px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid var(--border);
        }

        .q-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #e2e8f0;
            line-height: 1.5;
        }

        .step-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .step-label {
            font-size: 14px;
            color: #93c5fd;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        input:focus {
            border-color: var(--primary);
        }

        /* Canvas / Grafi Alanı */
        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
        }

        canvas {
            border: 1px solid #ccc;
            cursor: crosshair;
            background-color: #fff;
            max-width: 100%;
        }

        .canvas-hint {
            color: #475569;
            font-size: 12px;
            margin-top: 5px;
            font-weight: 600;
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #475569;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }

        .feedback {
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            line-height: 1.5;
        }

        .feedback.success {
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--success);
            color: #4ade80;
            display: block;
        }

        .feedback.error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: #f87171;
            display: block;
        }

        .solution-box {
            background: #0f172a;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            display: none;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Matematik Sınav Çalışma Sistemi</h1>
            <p>Formül, Grafik İşaretleme ve İlerleme Adımları</p>
        </header>

        <div class="stats-bar">
            <span id="question-indicator">Soru 1 / 8</span>
            <span id="score-tracker">Doğru: 0 | Yanlış: 0</span>
        </div>

        <div class="question-card">
            <div id="question-text" class="q-title">Soru yükleniyor...</div>
            
            <div id="interactive-area"></div>

            <button onclick="checkAnswer()">Adımları ve Cevabı Kontrol Et</button>

            <div id="feedback" class="feedback"></div>
            <div id="solution" class="solution-box"></div>
        </div>

        <div class="nav-buttons">
            <button class="btn-secondary" onclick="toggleSolution()">Tam Çözümü Göster</button>
            <button onclick="nextQuestion()">Sayıları Değiştir / Sonraki Soru</button>
        </div>
    </div>

    <footer>
        Design by Yusuf Berat Demetgül
    </footer>

    <script>
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let currentData = {};
        let selectedPoint = null;

        const questions = [
            // 1. GRAFİKLİ NOKTA İŞARETLEME VE UZAKLIK TOPLAMI
            () => {
                let x = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                let y = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                let ansDist = Math.abs(x) + Math.abs(y);
                selectedPoint = null;

                return {
                    type: "graph",
                    targetX: x,
                    targetY: y,
                    text: `A(${x}, ${y}) noktasını aşağıdaki koordinat sisteminde tıklayarak işaretleyiniz. Ardından noktanın eksenlere uzaklıkları toplamını hesaplayınız.`,
                    check: (inputs, point) => {
                        let pointOk = point && point.x === x && point.y === y;
                        let valOk = inputs.dist.trim() === ansDist.toString();
                        return {
                            isCorrect: pointOk && valOk,
                            msg: pointOk 
                                ? (valOk ? "Nokta ve Uzaklık Toplamı DOĞRU!" : "Nokta doğru fakat uzaklıklar toplamı yanlış.") 
                                : "Koordinat sisteminde noktayı yanlış yere işaretlediniz!"
                        };
                    },
                    solution: `1. Grafik üzerinde (${x}, ${y}) noktası işaretlenir.<br>2. x eksenine uzaklık = |y| = |${y}| = ${Math.abs(y)}<br>3. y eksenine uzaklık = |x| = |${x}| = ${Math.abs(x)}<br>4. Toplam = ${Math.abs(x)} + ${Math.abs(y)} = ${ansDist}`
                };
            },
            // 2. FONKSİYON DEĞER BULMA (Adım Adım Formül)
            () => {
                let a = Math.floor(Math.random() * 5) + 2;
                let b = Math.floor(Math.random() * 8) + 1;
                let val = (Math.random() < 0.5 ? 1 : -1) * (Math.floor(Math.random() * 4) + 1);
                let ans = a * val + b;

                return {
                    type: "steps",
                    fields: [
                        { id: "step1", label: `1. Adım: x yerine ${val} koyarak açık formülü yazınız (Örn: ${a}*(${val})+${b}):` },
                        { id: "step2", label: `2. Adım: f(${val}) Sonucu kaçtır?:` }
                    ],
                    text: `f(x) = ${a}x + ${b} olduğuna göre f(${val}) değerini işlem adımlarıyla bulunuz.`,
                    check: (inputs) => {
                        let resOk = inputs.step2.trim() === ans.toString();
                        return {
                            isCorrect: resOk,
                            msg: resOk ? "İşlem ve Sonuç DOĞRU!" : `Sonuç yanlış! Doğru cevap ${ans} olmalıydı.`
                        };
                    },
                    solution: `• Formül Yerine Koyma: f(${val}) = ${a}.(${val}) + ${b}<br>• Çarpma: ${a * val} + ${b}<br>• Sonuç: ${ans}`
                };
            },
            // 3. BİRİM FONKSİYON (Formül Eşitleme)
            () => {
                let k = Math.floor(Math.random() * 6) + 2;
                let mAns = k + 1;

                return {
                    type: "steps",
                    fields: [
                        { id: "step1", label: `1. Adım (Formül): Birim fonksiyonda x'in katsayısı kaça eşitlenir? Denklem olarak yazınız (Örn: m-${k}=1):` },
                        { id: "step2", label: "2. Adım: m değeri kaçtır?: " }
                    ],
                    text: `f(x) = (m - ${k})x fonksiyonu birim fonksiyon olduğuna göre "m" değerini formülüyle bulunuz.`,
                    check: (inputs) => {
                        let eqOk = inputs.step1.replace(/\s+/g, '').includes(`m-${k}=1`) || inputs.step1.replace(/\s+/g, '').includes(`m=${mAns}`);
                        let valOk = inputs.step2.trim() === mAns.toString();
                        return {
                            isCorrect: valOk,
                            msg: valOk ? "Formül eşitlemesi ve m değeri DOĞRU!" : `m değeri yanlış. m = ${mAns} olmalıydı.`
                        };
                    },
                    solution: `• Birim fonksiyon kuralı: f(x) = 1.x olmalıdır.<br>• Katsayı Eşitleme: m - ${k} = 1<br>• m = 1 + ${k} = ${mAns}`
                };
            },
            // 4. SABİT FONKSİYON (Formül Eşitleme)
            () => {
                let k = Math.floor(Math.random() * 6) + 2;
                let c = Math.floor(Math.random() * 12) + 4;
                let mAns = k;

                return {
                    type: "steps",
                    fields: [
                        { id: "step1", label: `1. Adım (Formül): Sabit fonksiyonda x'li terimi yok etmek için katsayı kaça eşitlenir? (Örn: m-${k}=0):` },
                        { id: "step2", label: "2. Adım: m değeri kaçtır?: " }
                    ],
                    text: `f(x) = (m - ${k})x + ${c} fonksiyonu sabit fonksiyon olduğuna göre "m" değerini formülüyle yazınız.`,
                    check: (inputs) => {
                        let valOk = inputs.step2.trim() === mAns.toString();
                        return {
                            isCorrect: valOk,
                            msg: valOk ? "Sabit fonksiyon kuralı ve m değeri DOĞRU!" : `m değeri yanlış. m = ${mAns} olmalıydı.`
                        };
                    },
                    solution: `• Sabit fonksiyonda x terimi bulunmaz (katsayısı 0'dır).<br>• m - ${k} = 0<br>• m = ${mAns}`
                };
            },
            // 5. DOĞRUSAL FONKSİYON ŞARITI VE DEĞERİ
            () => {
                let k = Math.floor(Math.random() * 5) + 2;
                let a = Math.floor(Math.random() * 4) + 2;
                let b = Math.floor(Math.random() * 8) - 4;
                let ans = a * (-1) + b;

                return {
                    type: "steps",
                    fields: [
                        { id: "step1", label: `1. Adım: Derecesi 3 olan x³'ü yok etmek için (m - ${k}) kaç yapılmalıdır? (m=?):` },
                        { id: "step2", label: `2. Adım: Kalan doğrusal fonksiyonu yazınız (Örn: f(x)=...x+...):` },
                        { id: "step3", label: "3. Adım: f(-1) sonucu kaçtır?:" }
                    ],
                    text: `f(x) = (m - ${k})x³ + ${a}x + ${b} fonksiyonu doğrusal fonksiyon olduğuna göre f(-1) kaçtır?`,
                    check: (inputs) => {
                        let mOk = inputs.step1.trim() === k.toString();
                        let ansOk = inputs.step3.trim() === ans.toString();
                        return {
                            isCorrect: mOk && ansOk,
                            msg: (mOk && ansOk) ? "Doğrusal fonksiyon yok etme adımı ve f(-1) DOĞRU!" : `Yanlış! m=${k} ve f(-1)=${ans} olmalıydı.`
                        };
                    },
                    solution: `• Doğrusal fonksiyon ax + b formundadır. x³ katsayısı 0 olmalı: m - ${k} = 0 -> m = ${k}<br>• Fonksiyon: f(x) = ${a}x + ${b}<br>• f(-1) = ${a}.(-1) + ${b} = ${ans}`
                };
            },
            // 6. EĞİM HESABI FORMÜLÜ
            () => {
                let x1 = 0, y1 = Math.floor(Math.random() * 5) + 1;
                let x2 = Math.floor(Math.random() * 4) + 2, y2 = y1 + x2 * (Math.floor(Math.random() * 3) + 1);
                let egim = (y2 - y1) / (x2 - x1);

                return {
                    type: "steps",
                    fields: [
                        { id: "step1", label: "1. Adım: Eğim Formülünü yazınız (m = (y2 - y1) / (x2 - x1)):" },
                        { id: "step2", label: `2. Adım: Sayıları yerine koyup eğimi (m) bulunuz:` }
                    ],
                    text: `A(${x1}, ${y1}) ve B(${x2}, ${y2}) noktalarından geçen doğrunun eğimini (m) formülüyle bulunuz.`,
                    check: (inputs) => {
                        let ok = inputs.step2.trim() === egim.toString();
                        return {
                            isCorrect: ok,
                            msg: ok ? "Eğim formülü ve hesabı DOĞRU!" : `Eğim hesabı yanlış. m = ${egim} olmalıydı.`
                        };
                    },
                    solution: `• Eğim Formülü: m = (y₂ - y₁) / (x₂ - x₁)<br>• m = (${y2} - ${y1}) / (${x2} - ${x1})<br>• m = ${y2 - y1} / ${x2 - x1} = ${egim}`
                };
            },
            // 7. TAKSİ / OTOPARK DENKLEM KURMA
            () => {
                let acilis = Math.floor(Math.random() * 10) + 10;
                let kmUcret = Math.floor(Math.random() * 5) + 4;
                let km = Math.floor(Math.random() * 5) + 3;
                let tutar = acilis + kmUcret * km;

                return {
                    type: "steps",
                    fields: [
                        { id: "step1", label: `A Şıkkı: İlişkiyi gösteren doğrusal denklemi yazınız (y = ...x + ...):` },
                        { id: "step2", label: `B Şıkkı: ${km} km giden yolcunun ödeyeceği toplam tutar kaçtır?:` }
                    ],
                    text: `Bir taksimetrenin açılış ücreti ${acilis} TL'dir. Gidilen her kilometre için ${kmUcret} TL alınmaktadır.<br>A) Denklem kurunuz.<br>B) ${km} km giden yolcunun ödeyeceği tutarı bulunuz.`,
                    check: (inputs) => {
                        let eqStr = inputs.step1.replace(/\s+/g, '').toLowerCase();
                        let eqOk = eqStr.includes(`${kmUcret}x+${acilis}`) || eqStr.includes(`${acilis}+${kmUcret}x`);
                        let valOk = inputs.step2.trim() === tutar.toString();
                        return {
                            isCorrect: valOk,
                            msg: valOk ? (eqOk ? "Denklem ve Tutar Hesabı MÜKEMMEL!" : "Tutar doğru ama denklem formatını y = ax + b şeklinde yazmaya özen göster.") : `Tutar yanlış! Cevap ${tutar} TL olmalıydı.`
                        };
                    },
                    solution: `• A) Doğrusal Denklem: y = ${kmUcret}x + ${acilis}<br>• B) x = ${km} için: y = ${kmUcret}.(${km}) + ${acilis} = ${kmUcret * km} + ${acilis} = ${tutar} TL`
                };
            },
            // 8. BİTKİ BÜYÜME TABLOSU & FORMÜLÜ
            () => {
                let artis = Math.floor(Math.random() * 3) + 2;
                let ay = 10;
                let ans = artis * ay;

                return {
                    type: "steps",
                    fields: [
                        { id: "step1", label: `1. Adım: f(x) = ${artis}x fonksiyonu için f(${ay}) işlem bağıntısını yazınız:` },
                        { id: "step2", label: `2. Adım: ${ay}. ayın sonundaki toplam büyüme miktarı kaçtır?:` }
                    ],
                    text: `f(x) = ${artis}x fonksiyonu bir bitkinin aylık büyüme hızını vermektedir. ${ay}. ayın sonundaki boyunu işlem bağıntısıyla hesaplayınız.`,
                    check: (inputs) => {
                        let ok = inputs.step2.trim() === ans.toString();
                        return {
                            isCorrect: ok,
                            msg: ok ? "Büyüme bağıntısı ve sonuç DOĞRU!" : `Yanlış cevap! ${artis} . ${ay} = ${ans} olmalıydı.`
                        };
                    },
                    solution: `• Bağıntı: f(${ay}) = ${artis} . ${ay}<br>• Sonuç: ${ans} birim büyüme.`
                };
            }
        ];

        function loadQuestion() {
            document.getElementById("feedback").className = "feedback";
            document.getElementById("feedback").style.display = "none";
            document.getElementById("solution").style.display = "none";

            currentData = questions[currentQuestionIndex]();
            document.getElementById("question-text").innerHTML = `${currentQuestionIndex + 1}- ${currentData.text}`;
            document.getElementById("question-indicator").innerText = `Soru ${currentQuestionIndex + 1} / ${questions.length}`;

            const area = document.getElementById("interactive-area");
            area.innerHTML = "";

            if (currentData.type === "graph") {
                area.innerHTML = `
                    <div class="canvas-container">
                        <canvas id="gridCanvas" width="300" height="300"></canvas>
                        <div class="canvas-hint">Tıklayarak A(${currentData.targetX}, ${currentData.targetY}) noktasını kırmızı ile işaretleyin</div>
                    </div>
                    <div class="step-box">
                        <div class="step-label">Eksenlere Uzaklıkları Toplamı (|x| + |y|):</div>
                        <input type="text" id="input_dist" placeholder="Uzaklıklar toplamını yazın...">
                    </div>
                `;
                initCanvas();
            } else if (currentData.type === "steps") {
                let html = "";
                currentData.fields.forEach(f => {
                    html += `
                        <div class="step-box">
                            <div class="step-label">${f.label}</div>
                            <input type="text" id="input_${f.id}" placeholder="Yanıtınızı buraya yazın...">
                        </div>
                    `;
                });
                area.innerHTML = html;
            }
        }

        // KARTENZYEN GRAFİK ÇİZİMİ VE TIKLAMA
        function initCanvas() {
            const canvas = document.getElementById("gridCanvas");
            if(!canvas) return;
            const ctx = canvas.getContext("2d");
            const w = canvas.width;
            const h = canvas.height;
            const gridSize = 25; 
            const originX = w / 2;
            const originY = h / 2;

            function drawGrid() {
                ctx.clearRect(0, 0, w, h);
                ctx.strokeStyle = "#e2e8f0";
                ctx.lineWidth = 1;

                for (let x = 0; x <= w; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0); ctx.lineTo(x, h);
                    ctx.stroke();
                }
                for (let y = 0; y <= h; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y); ctx.lineTo(w, y);
                    ctx.stroke();
                }

                // Eksenler
                ctx.strokeStyle = "#0f172a";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, originY); ctx.lineTo(w, originY);
                ctx.moveTo(originX, 0); ctx.lineTo(originX, h);
                ctx.stroke();

                ctx.fillStyle = "#0f172a";
                ctx.font = "12px sans-serif";
                ctx.fillText("X", w - 15, originY - 5);
                ctx.fillText("Y", originX + 5, 15);
            }

            drawGrid();

            canvas.onclick = function(e) {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                let gridX = Math.round((clickX - originX) / gridSize);
                let gridY = Math.round((originY - clickY) / gridSize);

                selectedPoint = { x: gridX, y: gridY };

                drawGrid();

                // Noktayı çiz
                let px = originX + gridX * gridSize;
                let py = originY - gridY * gridSize;

                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.arc(px, py, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#1e293b";
                ctx.font = "bold 13px sans-serif";
                ctx.fillText(`(${gridX},${gridY})`, px + 8, py - 8);
            };
        }

        function checkAnswer() {
            const feedback = document.getElementById("feedback");
            let inputs = {};

            if (currentData.type === "graph") {
                inputs.dist = document.getElementById("input_dist").value;
                let res = currentData.check(inputs, selectedPoint);
                showFeedback(res.isCorrect, res.msg);
            } else {
                currentData.fields.forEach(f => {
                    inputs[f.id] = document.getElementById(`input_${f.id}`).value;
                });
                let res = currentData.check(inputs);
                showFeedback(res.isCorrect, res.msg);
            }
        }

        function showFeedback(isCorrect, msg) {
            const feedback = document.getElementById("feedback");
            if (isCorrect) {
                feedback.className = "feedback success";
                feedback.innerHTML = `<strong>TEBRİKLER!</strong> ${msg}`;
                correctCount++;
            } else {
                feedback.className = "feedback error";
                feedback.innerHTML = `<strong>KONTROL EDİN:</strong> ${msg}`;
                wrongCount++;
            }
            feedback.style.display = "block";
            updateStats();
        }

        function toggleSolution() {
            const solBox = document.getElementById("solution");
            if (solBox.style.display === "block") {
                solBox.style.display = "none";
            } else {
                solBox.innerHTML = `<strong>Sınav Çözüm Adımları & Formüller:</strong><br>${currentData.solution}`;
                solBox.style.display = "block";
            }
        }

        function nextQuestion() {
            currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
            loadQuestion();
        }

        function updateStats() {
            document.getElementById("score-tracker").innerText = `Doğru: ${correctCount} | Yanlış: ${wrongCount}`;
        }

        // İlk soruyu yükle
        loadQuestion();
    </script>
</body>
</html>
